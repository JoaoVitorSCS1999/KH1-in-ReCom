[package]
name = "kh1-recom-assets"
description = "The asset build step: converts KH1 FM Sora's motions (the player's own xa_ex_0010.mset / .mdls) into Re:Chain of Memories' own motion pack (PL0001.ANN), so Re:CoM's engine plays them natively. Reads the user's own installs; ships no game data."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# KH1_ASSET_STEP_HASH: the step's source hash, for the DLL's build stamp (src/stamp.rs).
build = "step_hash.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kh1-recom-build"
path = "src/main.rs"

[[bin]]
name = "kh1-flip-test"
path = "src/flip_main.rs"

[dependencies]
kh1-formats = { path = "../kh1-formats" }
kh1-anim = { path = "../kh1-anim" }
kh2-formats-lite = { path = "../kh2-formats-lite" }
# zlib for the PNG HD pictures (KH1's per-language `uitex.bin` picture 1); already in the lockfile.
miniz_oxide = "0.8"

[dev-dependencies]
# M10's test checks the manifest's constants against the behaviour's list.
kh1-core = { path = "../kh1-core" }
